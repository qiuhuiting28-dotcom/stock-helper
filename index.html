<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#23415e">
<title>台股看盤小幫手</title>
<style>
  :root{
    --ink:#1a1a1a;
    --ink-soft:#565d66;
    --muted:#8a8f96;
    --bg:#f7f5f0;
    --card:#ffffff;
    --line:#e5e0d8;
    --up:#d2302f;          /* 台灣慣例：紅＝漲 */
    --down:#1d7a3e;        /* 綠＝跌 */
    --up-bg:#fbeaea;
    --down-bg:#e9f4ec;
    --navy:#23415e;
    --gold:#b07a2c;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{font-size:19px; scroll-behavior:smooth}
  html.fs-big{font-size:23px}
  html.fs-bigger{font-size:27px}
  body{
    margin:0;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  .wrap{max-width:900px; margin:0 auto; padding:20px 16px 56px}
  @media(min-width:1100px){ .wrap{max-width:1000px} }

  header{display:flex; flex-wrap:wrap; align-items:center; gap:10px; justify-content:space-between; margin-bottom:16px}
  .brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .brand h1{font-size:1.3rem; margin:0; color:var(--navy); letter-spacing:.02em}
  .brand .sub{font-size:.78rem; color:var(--muted)}
  .badge{font-size:.68rem; color:var(--gold); border:1px solid var(--gold); border-radius:999px; padding:2px 9px; white-space:nowrap}
  .fsbtns{display:flex; gap:6px}
  .fsbtns button{
    font-size:.8rem; padding:7px 13px; border-radius:9px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink-soft);
  }
  .fsbtns button.on{background:var(--navy); color:#fff; border-color:var(--navy)}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px}
  h2.sec{font-size:.85rem; color:var(--navy); margin:0 0 4px; letter-spacing:.05em; font-weight:700}
  .sec-desc{font-size:.78rem; color:var(--muted); margin:0 0 12px}

  .idx{display:flex; flex-wrap:wrap; align-items:flex-end; gap:14px}
  .idx .big{font-size:clamp(1.9rem,7vw,2.6rem); font-weight:800; line-height:1.1; letter-spacing:-.01em}
  .idx .chg{font-size:1.1rem; font-weight:700; padding:2px 10px; border-radius:8px; white-space:nowrap}
  .idx .meta{font-size:.8rem; color:var(--ink-soft)}
  .up{color:var(--up)} .down{color:var(--down)}
  .up-bg{background:var(--up-bg)} .down-bg{background:var(--down-bg)}

  .summary{background:#fdf8ee; border:1px solid #ead9b8; border-radius:var(--radius); padding:14px 18px; font-size:.95rem; margin-bottom:16px}
  .summary b{color:var(--navy)}

  .watch-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:6px}
  .addBtn{
    font-size:.82rem; font-weight:700; color:#fff; background:var(--navy);
    border:none; border-radius:10px; padding:9px 15px; cursor:pointer;
  }
  .addBtn.on{background:var(--muted)}

  .add-panel{margin:10px 0 14px; padding:14px; background:#faf9f6; border:1px solid var(--line); border-radius:12px}
  #search{
    width:100%; font-size:1rem; padding:13px 15px; border:1px solid var(--line);
    border-radius:11px; margin-bottom:10px; background:#fff; color:var(--ink);
    font-family:inherit;
  }
  #search:focus{outline:2px solid var(--navy); outline-offset:1px; border-color:var(--navy)}
  .add-list{max-height:360px; overflow-y:auto; -webkit-overflow-scrolling:touch}
  .add-item{
    display:flex; align-items:center; gap:10px; padding:13px 8px;
    border-bottom:1px dashed var(--line); cursor:pointer; font-size:.92rem;
  }
  .add-item:hover,.add-item:active{background:#fff}
  .add-item .nm{font-weight:700}
  .add-item .code{color:var(--muted); font-size:.76rem}
  .add-item .px{margin-left:auto; color:var(--ink-soft); font-size:.82rem}
  .add-item .plus{color:var(--up); font-weight:800; font-size:1.15rem; margin-left:6px}
  .add-empty{padding:16px 8px; color:var(--muted); font-size:.85rem}

  .stock{border-bottom:1px solid var(--line); padding:14px 0}
  .stock:last-child{border-bottom:none}
  .row1{display:flex; align-items:center; gap:10px; cursor:pointer; -webkit-tap-highlight-color:transparent}
  .row1 .lead{display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1 1 auto; min-width:0}
  .row1 .nm{font-size:1.05rem; font-weight:700}
  .row1 .code{font-size:.76rem; color:var(--muted)}
  .row1 .px{display:flex; flex-direction:column; align-items:flex-end; flex:0 0 auto; line-height:1.25}
  .row1 .price{font-size:clamp(1.2rem,5vw,1.5rem); font-weight:800; letter-spacing:-.01em}
  .row1 .chg{font-size:.9rem; font-weight:700; padding:1px 7px; border-radius:7px; margin-top:3px; white-space:nowrap}
  .tag{font-size:.7rem; padding:3px 9px; border-radius:999px; font-weight:700; white-space:nowrap}
  .tag.strong{background:var(--up-bg); color:var(--up)}
  .tag.weak{background:var(--down-bg); color:var(--down)}
  .tag.flat{background:#f0f0f0; color:var(--ink-soft)}
  .tag.pos{background:#fdeee0; color:var(--gold)}
  .spark{display:inline-flex; align-items:center}
  @media(max-width:480px){ .spark{display:none} }

  .note{font-size:.9rem; color:var(--ink-soft); margin-top:8px}
  .note b.hl-up{color:var(--up); font-weight:700}
  .note b.hl-down{color:var(--down); font-weight:700}

  .detail{display:none; margin-top:12px; padding:4px 16px; background:#faf9f6; border-radius:12px}
  .stock.open .detail{display:block}
  .metric{padding:11px 0; border-top:1px dashed var(--line)}
  .metric:first-child{border-top:none}
  .metric .m-head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
  .metric .m-name{font-size:.8rem; color:var(--navy); font-weight:700}
  .metric .m-val{font-size:.98rem; font-weight:800}
  .metric .m-mean{font-size:.86rem; color:var(--ink-soft); margin-top:4px; line-height:1.55}
  .metric .m-mean .k-up{color:var(--up); font-weight:700}
  .metric .m-mean .k-down{color:var(--down); font-weight:700}

  .delBtn{
    margin-top:10px; width:100%; font-size:.82rem; padding:10px; cursor:pointer;
    color:var(--down); background:#fff; border:1px solid #cfe0d3; border-radius:10px;
  }
  .delBtn:hover{background:var(--down-bg)}

  .rank-cols{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  .rank-item{display:flex; align-items:baseline; gap:8px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:.9rem}
  .rank-item:last-child{border-bottom:none}
  .rank-item .nm{font-weight:700}
  .rank-item .code{color:var(--muted); font-size:.74rem}
  .rank-item .pct{margin-left:auto; font-weight:800}

  .legal{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  .legal .cell{text-align:center; padding:12px 6px; background:#faf9f6; border-radius:11px}
  .legal .who{font-size:.8rem; color:var(--muted)}
  .legal .amt{font-size:clamp(1rem,4vw,1.2rem); font-weight:800}
  .legal-total{grid-column:1/-1; margin-top:2px; padding:12px 14px; background:#faf9f6; border-radius:11px; font-size:.86rem; color:var(--ink-soft); line-height:1.6}
  .legal-total b{color:var(--navy)}

  .empty{padding:20px 8px; color:var(--muted); font-size:.9rem; text-align:center}
  footer{font-size:.72rem; color:var(--muted); margin-top:26px; line-height:1.7}
  footer a{color:var(--navy)}

  /* 試算買賣價 */
  .calc{margin-top:14px; padding:14px; background:#fff; border:1px solid var(--line); border-radius:12px}
  .calc-h{font-size:.82rem; font-weight:700; color:var(--navy); margin-bottom:10px; line-height:1.5}
  .calc-in{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .calc-in input{flex:1 1 120px; min-width:0; font-size:1rem; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-family:inherit; color:var(--ink)}
  .calc-in input:focus{outline:2px solid var(--navy); outline-offset:1px}
  .calc-in button{font-size:.9rem; font-weight:700; padding:11px 16px; border-radius:10px; border:none; cursor:pointer; color:#fff; white-space:nowrap}
  .calc-in .buy{background:var(--up)}
  .calc-in .sell{background:var(--down)}
  .calc-out{margin-top:12px; font-size:.86rem; color:var(--ink-soft); line-height:1.6}
  .calc-out .chip{display:inline-block; font-size:.84rem; font-weight:800; padding:3px 13px; border-radius:999px; margin-bottom:8px}
  .chip.good{background:#e9f4ec; color:#1d7a3e}
  .chip.ok{background:#eef1f5; color:#23415e}
  .chip.warn{background:#fdf1e3; color:#b07a2c}
  .calc-out .cl{display:block; margin-top:5px}
  .calc-verdict{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
  .calc-verdict .chip{margin-bottom:0}
  .prob{display:inline-block; font-size:.86rem; font-weight:800; padding:5px 14px; border-radius:999px}
  .prob.high{background:#e9f4ec; color:#1d7a3e}
  .prob.mid{background:#fdf1e3; color:#b07a2c}
  .prob.low{background:#f0f1f3; color:#6b7280}
  .arr{font-size:.68rem; padding:3px 8px; border-radius:6px; font-weight:700; white-space:nowrap; border:1px solid currentColor}
  .arr.up{color:var(--up); background:var(--up-bg)}
  .arr.down{color:var(--down); background:var(--down-bg)}
  .arr.flat{color:var(--ink-soft); background:#f0f0f0}
  .ladder{margin:8px 0 6px}
  .ladder-verdict{font-size:.86rem; font-weight:700; padding:9px 13px; border-radius:9px; margin-bottom:8px; line-height:1.5}
  .ladder-verdict.up{background:var(--up-bg); color:var(--up)}
  .ladder-verdict.down{background:var(--down-bg); color:var(--down)}
  .ladder-verdict.flat{background:#f0f0f0; color:var(--ink-soft)}
  .ladder svg{margin-top:2px}
  .ladder .cap{font-size:.72rem; color:var(--muted); margin-top:4px; line-height:1.5}

  @media(max-width:600px){
    html{font-size:18px}
    html.fs-big{font-size:21px}
    html.fs-bigger{font-size:24px}
    .wrap{padding:14px 12px 44px}
    .card{padding:15px 14px}
    .rank-cols{grid-template-columns:1fr; gap:6px}
    .legal{grid-template-columns:1fr}
    .idx .meta.right{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>台股看盤小幫手</h1>
      <span class="sub">每日看盤一頁</span>
      <span class="badge" id="dataBadge">示範數據</span>
    </div>
    <div class="fsbtns" id="fsbtns">
      <button data-fs="0" class="on">標準</button>
      <button data-fs="big">大</button>
      <button data-fs="bigger">特大</button>
    </div>
  </header>

  <div class="summary" id="summary"></div>

  <div class="card">
    <h2 class="sec">大盤指數（加權指數）</h2>
    <p class="sec-desc" id="idx-time"></p>
    <div class="idx" id="idx"></div>
    <div id="idx-chart" style="margin-top:14px"></div>
  </div>

  <div class="card">
    <div class="watch-head">
      <h2 class="sec" style="margin:0">自選股</h2>
      <button class="addBtn" id="addBtn">＋ 新增股票</button>
    </div>
    <p class="sec-desc">點股票展開：每項數字都有白話說明，還能試算你自己的買賣價</p>
    <div class="add-panel" id="addPanel" hidden>
      <input id="search" type="search" placeholder="輸入名稱或代號，例如 台積電 或 2330" autocomplete="off">
      <div class="add-list" id="addList"></div>
    </div>
    <div id="stocks"></div>
  </div>

  <div class="card">
    <h2 class="sec">今日漲跌排行</h2>
    <p class="sec-desc">依資料庫裡的股票排出漲最多與跌最多（示範）</p>
    <div class="rank-cols">
      <div id="top-up"></div>
      <div id="top-down"></div>
    </div>
  </div>

  <div class="card">
    <h2 class="sec">三大法人買賣超</h2>
    <p class="sec-desc">買超＝今天買的比賣的多；賣超＝賣的比買的多。下面是今天三大法人「淨買賣」金額（億元）。</p>
    <div class="legal" id="legal"></div>
  </div>

  <footer id="footer"></footer>
</div>

const K = "taiwan-stock-v2";

/* 近一個月高低區間 [最低, 最高]（示範） */
const RANGE = {
  "2330":[1010,1120],"2317":[195,215],"2454":[1200,1350],"2412":[123,129],
  "2882":[64,71],"1301":[43,49],"2603":[188,216],"2002":[21.2,23.6],
  "2308":[375,410],"2881":[88,96],"2891":[37.2,40.2],"1216":[76,83],
  "2609":[72,86],"2886":[38,41],"1101":[32,35.5],"2382":[265,300],
  "2303":[46.5,51],"2884":[26,28.2],"1326":[40,45],"2207":[595,650],
  "2474":[172,190],"3008":[2420,2700]
};
DB.forEach(s=>{ const r=RANGE[s.code]; if(r && !s.hi30){ s.lo30=r[0]; s.hi30=r[1]; } });

/* 季線(60日)／年線(240日) 示範值：由月線趨勢推導，示範用，接真資料後改由 K 線計算 */
const round2 = n => Math.round(n*100)/100;
DB.forEach(s=>{
  if(s.ma60!=null) return;
  const trend = (s.price - s.ma20)/s.ma20;
  s.ma60  = round2(s.ma20 * (1 - trend*1.5));
  s.ma240 = round2(s.ma20 * (1 - trend*5));
  s.hi60  = round2(Math.max(s.hi30, s.price) * (1 + 0.02 + Math.abs(trend)*0.3));
  s.lo60  = round2(Math.min(s.lo30, s.price) * (1 - 0.02 - Math.abs(trend)*0.3));
  s.hi240 = round2(s.hi60 * (1 + 0.10 + Math.abs(trend)*0.4));
  s.lo240 = round2(s.lo60 * (1 - 0.10 - Math.abs(trend)*0.4));
});

function getWatch(){

      const a = JSON.parse(raw);

}

function analyze(s){
  const pct = pctOf(s);
  let dir;
  if(pct>=2) dir="大漲";
  else if(pct>=0.5) dir="上漲";
  else if(pct>-0.5) dir="小漲小跌";
  else if(pct>-2) dir="下跌";
  else dir="大跌";
  const aboveMa5 = s.price >= s.ma5;
  const maText = aboveMa5 ? "站上 5 日線，短線偏強" : "跌破 5 日線，短線偏弱";
  const volBig = s.vol > s.avgVol;
  const volText = volBig ? "量能放大，買賣熱絡" : "量能縮小，觀望居多";
  let tag, tagCls;
  if(pct>=2){tag="強勢"; tagCls="strong";}
  else if(pct>=0.5){tag="偏多"; tagCls="pos";}
  else if(pct>-0.5){tag="整理"; tagCls="flat";}
  else if(pct>-2){tag="偏弱"; tagCls="flat";}
  else {tag="轉弱"; tagCls="weak";}
  return {pct, dir, maText, volText, tag, tagCls, aboveMa5};
}

function calcPrice(s, P, side){
  /* 台股 ±10% 漲跌停（以昨收算，取整到 0.01，略去 tick 細節，故標「約」） */
  const up = Math.round(s.prev*1.1*100)/100;
  const dn = Math.round(s.prev*0.9*100)/100;
  const posPct = Math.max(0, Math.min(100, (P - s.lo30)/(s.hi30 - s.lo30)*100));
  const vsNow = (P - s.price)/s.price*100;
  const distPct = Math.abs(P - s.price)/s.price*100;

  /* 1) 價格好不好（划不划算） */
  let chip, cls, q = [];
  if(side==="sell"){
    if(P >= s.prs){ chip="好價"; cls="good"; q.push(`這個價比壓力 ${fmt(s.prs)} 還高，是漂亮的好價位。`); }
    else if(P > s.price*1.02){ chip="合理偏高"; cls="good"; q.push("這個價比現價高，是在等它反彈再賣，合理。"); }
    else if(P >= s.price*0.98){ chip="合理"; cls="ok"; q.push("這個價跟現價差不多，是可以接受的範圍。"); }
    else if(P >= s.sup){ chip="偏低"; cls="warn"; q.push("這個價比現價低，等於少賺一點，除非急用錢，不然可以再等。"); }
    else { chip="太低"; cls="warn"; q.push(`這個價跌破支撐 ${fmt(s.sup)}，等於認賠殺出，除非看壞後市，否則不建議。`); }
  } else {
    if(P <= s.sup){ chip="便宜"; cls="good"; q.push(`這個價比支撐 ${fmt(s.sup)} 還低，是便宜的價位。`); }
    else if(P < s.price*0.98){ chip="合理偏低"; cls="good"; q.push("這個價比現價低，是在等它回檔再買，合理。"); }
    else if(P <= s.price*1.02){ chip="合理"; cls="ok"; q.push("這個價跟現價差不多，是可以接受的範圍。"); }
    else if(P <= s.prs){ chip="偏高"; cls="warn"; q.push("這個價比現價高，是在追高，風險比較大。"); }
    else { chip="太貴"; cls="warn"; q.push(`這個價超過壓力 ${fmt(s.prs)}，是明顯追高，不建議。`); }
  }

  /* 2) 成交機率（三級） */
  let prob, probCls;
  if(P > up || P < dn){ prob = "幾乎不可能"; probCls = "low"; }
  else if(P > s.hi30 || P < s.lo30 || distPct > 5){ prob = (side==="sell" ? "要等大漲" : "要等大跌"); probCls = "mid"; }
  else { prob = "今天很可能"; probCls = "high"; }

  /* 3) 今天到不到得了（漲跌停） */
  let fillLine;
  if(side==="sell"){
    if(P > up) fillLine = `今天最高只能漲到漲停約 ${fmt(up)}（昨收 ${fmt(s.prev)} 的 +10%），你掛 ${fmt(P)} 超過了，今天賣不到。`;
    else fillLine = `今天上限是漲停約 ${fmt(up)}，你的價在範圍內；但漲停鎖住時要有人買才賣得掉。`;
  } else {
    if(P < dn) fillLine = `今天最低只能跌到跌停約 ${fmt(dn)}（昨收 ${fmt(s.prev)} 的 −10%），你掛 ${fmt(P)} 低於了，今天買不到。`;
    else fillLine = `今天下限是跌停約 ${fmt(dn)}，你的價在範圍內；但跌停鎖住時要有人賣才買得到。`;
  }

  /* 4) 近一個月有沒有出現過 */
  let reach;
  if(P > s.hi30) reach = `近一個月最高才 ${fmt(s.hi30)}，你這個價從沒到過。`;
  else if(P < s.lo30) reach = `近一個月最低才 ${fmt(s.lo30)}，你這個價從沒到過。`;
  else reach = `近一個月 ${fmt(s.lo30)}～${fmt(s.hi30)} 之間出現過，成交機會正常。`;

  const where = posPct<=25 ? "偏低、比較便宜" : (posPct>=75 ? "偏高、比較貴" : "在中間");
  const lines = [fillLine, reach, ...q,
    `這個價位在「近一個月高低 ${fmt(s.lo30)}～${fmt(s.hi30)}」的 ${posPct.toFixed(0)}% 位置（0% 最低、100% 最高），${where}。`,
    `對照：現價 ${fmt(s.price)}、今日漲停約 ${fmt(up)}、跌停約 ${fmt(dn)}、支撐 ${fmt(s.sup)}、壓力 ${fmt(s.prs)}；你的價比現價${vsNow>=0?"高":"低"} ${Math.abs(vsNow).toFixed(1)}%。`];
  return {chip, cls, prob, probCls, lines};
}

function sparkline(arr, w, h, up){
  const min=Math.min(...arr), max=Math.max(...arr), range=(max-min)||1;
  const pts = arr.map((v,i)=>[(i/(arr.length-1))*w, h-(v-min)/range*(h-4)-2]);
  const line = pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const col = up ? "var(--up)" : "var(--down)";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible">
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.2" fill="${col}"/>
  </svg>`;
}
function indexChart(series){
  const w=860, h=200, pad=10;
  const min=Math.min(...series), max=Math.max(...series), range=(max-min)||1;
  const pts = series.map((v,i)=>[pad+(i/(series.length-1))*(w-pad*2), h-pad-(v-min)/range*(h-pad*2)]);
  const line = pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  const area = `M ${pad},${h-pad} L ${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L ")} L ${last[0].toFixed(1)},${h-pad} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2302f" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d2302f" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#ag)"/>
    <polyline points="${line}" fill="none" stroke="#d2302f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="#d2302f" stroke="#fff" stroke-width="2"/>
    <text x="${pad}" y="16" font-size="11" fill="#888">近 30 日加權指數走勢</text>
  </svg>`;
}

function maVerdict(s){
  const aboveCount = (s.price>s.ma5?1:0)+(s.price>s.ma20?1:0)+(s.price>s.ma60?1:0)+(s.price>s.ma240?1:0);
  const bullOrder = s.ma5>=s.ma20 && s.ma20>=s.ma60 && s.ma60>=s.ma240;
  const bearOrder = s.ma5<=s.ma20 && s.ma20<=s.ma60 && s.ma60<=s.ma240;
  const arr = bullOrder ? "多頭排列" : (bearOrder ? "空頭排列" : "均線糾結");
  const label = bullOrder ? "多頭" : (bearOrder ? "空頭" : "糾結");
  const posTxt = aboveCount===4 ? "站上全部 4 條均線" : (aboveCount===0 ? "跌破全部 4 條均線" : `夾在均線中間（站上 ${aboveCount} 條）`);
  const vcls = (bullOrder && aboveCount>=3) ? "up" : ((bearOrder && aboveCount<=1) ? "down" : "flat");
  const advice = (bullOrder && aboveCount===4) ? "短均線在上、股價最強，偏多。"
    : ((bearOrder && aboveCount===0) ? "均線由短到長愈來愈高，股價最弱，偏空。"
    : "多空混在一起，方向不明，先觀望。");
  return {aboveCount, bullOrder, bearOrder, arr, label, posTxt, vcls, advice};
}

function maLadder(s){
  const mas = [{k:"年",v:s.ma240},{k:"季",v:s.ma60},{k:"月",v:s.ma20},{k:"5日",v:s.ma5}];
  const all = [...mas.map(m=>m.v), s.price];
  const lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi-lo)*0.12 || 1;
  const min = lo-pad, max = hi+pad;
  const W=720, H=170, padX=54, axisY=100;
  const x = v => padX + (v-min)/(max-min)*(W-padX*2);

  const v = maVerdict(s);
  const pcol = v.vcls==="up" ? "#d2302f" : (v.vcls==="down" ? "#1d7a3e" : "#23415e");

  const sorted = [...mas].sort((a,b)=>a.v-b.v);
  const laneLast = [];
  const marks = sorted.map(m=>{
    const xx = x(m.v);
    let L=0;
    while(laneLast[L]!==undefined && xx-laneLast[L] < 74) L++;
    laneLast[L]=xx;
    const ly = axisY-24-L*18;
    return `<line x1="${xx.toFixed(1)}" y1="${axisY-7}" x2="${xx.toFixed(1)}" y2="${axisY+7}" stroke="#c3bcae" stroke-width="1.5"/>
      <circle cx="${xx.toFixed(1)}" cy="${axisY}" r="3.6" fill="#8a8f96"/>
      <text x="${xx.toFixed(1)}" y="${ly}" text-anchor="middle" font-size="13" fill="#565d66">${m.k} ${fmt(m.v)}</text>`;
  }).join("");

  const px = x(s.price);
  const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <line x1="${padX}" y1="${axisY}" x2="${W-padX}" y2="${axisY}" stroke="#e3ddd2" stroke-width="2"/>
    ${marks}
    <polygon points="${px.toFixed(1)},${axisY-2} ${(px-7).toFixed(1)},${axisY-15} ${(px+7).toFixed(1)},${axisY-15}" fill="${pcol}"/>
    <text x="${px.toFixed(1)}" y="${axisY+28}" text-anchor="middle" font-size="14" font-weight="700" fill="${pcol}">現價 ${fmt(s.price)}</text>
  </svg>`;

  return `<div class="ladder">
    <div class="ladder-verdict ${v.vcls}">${v.arr}：${v.posTxt}。${v.advice}</div>
    ${svg}
    <div class="cap">尺上每個點是一條均線的價位；均線在現價左邊＝比現價低（偏多），在右邊＝比現價高（偏空）。</div>
  </div>`;
}

function renderStocks(){
  const box = document.getElementById("stocks");
  const watch = getWatch().map(byCode).filter(Boolean);
  if(!watch.length){
    box.innerHTML = `<div class="empty">還沒有自選股。<br>點上面的「＋ 新增股票」加幾檔吧。</div>`;
    return;
  }
  box.innerHTML = watch.map((s,idx)=>{
    const a = analyze(s);
    const v = maVerdict(s);
    const chg = s.price - s.prev;
    const c = dirClass(chg);
    const b = dirBg(chg);
    const ms = metricMeanings(s);
    const detailHtml = ms.map(mm=>`
      <div class="metric">
        <div class="m-head"><span class="m-name">${mm.name}</span><span class="m-val">${mm.val}</span></div>
        <div class="m-mean">${mm.mean}</div>
      </div>`).join("");
    return `<div class="stock" id="s-${idx}">
      <div class="row1" data-i="${idx}">
        <div class="lead">
          <span class="nm">${s.name}</span>
          <span class="code">${s.code}</span>
          <span class="tag ${a.tagCls}">${a.tag}</span>
          <span class="arr ${v.vcls}" title="四條均線排列">${v.label}</span>
          <span class="spark">${sparkline(s.spark, 64, 24, chg>=0)}</span>
        </div>
        <div class="px">
          <span class="price ${c}">${fmt(s.price)}</span>
          <span class="chg ${c} ${b}">${signAmt(chg)}（${fmtPct(a.pct)}）</span>
        </div>
      </div>
      <div class="note">今天<b class="${chg>=0?'hl-up':'hl-down'}">${a.dir} ${fmtPct(a.pct)}</b>，${a.maText}，${a.volText}。</div>
      <div class="detail">
        ${maLadder(s)}
        ${detailHtml}
        <div class="calc">
          <div class="calc-h">試算你的買賣價：輸入一個價格，看看合不合理、在歷史區間的哪裡</div>
          <div class="calc-in">
            <input type="number" class="calcPrice" inputmode="decimal" placeholder="例如 ${s.price.toFixed(0)}">
            <button class="calcBtn buy" data-code="${s.code}" data-side="buy">我想買</button>
            <button class="calcBtn sell" data-code="${s.code}" data-side="sell">我想賣</button>
          </div>
          <div class="calc-out" id="calc-${s.code}"></div>
        </div>
        <button class="delBtn" data-code="${s.code}">✕ 從自選股移除這檔</button>
      </div>
    </div>`;
  }).join("");

  box.querySelectorAll(".row1").forEach(el=>{
    el.addEventListener("click", ()=>{
      document.getElementById("s-"+el.dataset.i).classList.toggle("open");
    });
  });
  box.querySelectorAll(".delBtn").forEach(btn=>{
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      const code = btn.dataset.code;
      const s = byCode(code);
      if(!s) return;
      if(confirm(`要把「${s.name} ${code}」從自選股移除嗎？`)){
        setWatch(getWatch().filter(c=>c!==code));
        renderStocks(); renderSummary(); renderAddList();
      }
    });
  });
  box.querySelectorAll(".calcBtn").forEach(btn=>{
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      const code = btn.dataset.code, side = btn.dataset.side;
      const s = byCode(code); if(!s) return;
      const wrap = btn.closest(".calc");
      const inp = wrap ? wrap.querySelector(".calcPrice") : null;
      const P = inp ? parseFloat(inp.value) : NaN;
      const out = document.getElementById("calc-"+code);
      if(!out) return;
      if(!isFinite(P) || P<=0){ out.innerHTML = '<span class="cl">請先在上面輸入一個價格（例如 '+s.price.toFixed(0)+'）。</span>'; return; }
      const r = calcPrice(s, P, side);
      out.innerHTML = `<div class="calc-verdict"><span class="prob ${r.probCls}">成交機率：${r.prob}</span><span class="chip ${r.cls}">價格：${r.chip}</span></div>` + r.lines.map(l=>`<span class="cl">${l}</span>`).join("");
    });
  });
}

function renderAddList(){
  const listEl = document.getElementById("addList");
  const kw = (document.getElementById("search").value||"").trim().toLowerCase();
  const watch = getWatch();
  const avail = DB.filter(s=>!watch.includes(s.code))
    .filter(s=> !kw || s.name.toLowerCase().includes(kw) || s.code.includes(kw));
  if(!avail.length){
    listEl.innerHTML = `<div class="add-empty">${kw?"找不到符合的股票":"所有股票都已經在自選股裡了"}</div>`;
    return;
  }
  listEl.innerHTML = avail.map(s=>{
    const c = dirClass(s.price-s.prev);
    return `<div class="add-item" data-code="${s.code}">
      <span class="nm">${s.name}</span><span class="code">${s.code}</span>
      <span class="px ${c}">${fmt(s.price)}</span>
      <span class="plus">＋</span>
    </div>`;
  }).join("");
  listEl.querySelectorAll(".add-item").forEach(el=>{
    el.addEventListener("click", ()=>{
      const code = el.dataset.code;
      const w = getWatch();
      if(!w.includes(code)){ w.push(code); setWatch(w); }
      renderStocks(); renderSummary(); renderAddList();
    });
  });
}

function renderRanks(){
  const sorted = DB.map(s=>({name:s.name, code:s.code, pct:pctOf(s)}));
  const ups = [...sorted].sort((a,b)=>b.pct-a.pct).slice(0,5);
  const downs = [...sorted].sort((a,b)=>a.pct-b.pct).slice(0,3);
  const row = r=>`<div class="rank-item"><span class="nm">${r.name}</span><span class="code">${r.code}</span><span class="pct ${dirClass(r.pct)}">${fmtPct(r.pct)}</span></div>`;
  document.getElementById("top-up").innerHTML = `<h2 class="sec" style="color:var(--up)">▲ 漲幅前段班</h2>` + ups.map(row).join("");
  document.getElementById("top-down").innerHTML = `<h2 class="sec" style="color:var(--down)">▼ 跌幅前段班</h2>` + downs.map(row).join("");
}

function renderLegal(){
  const total = LEGAL.reduce((a,b)=>a+b.amt,0);
  const cells = LEGAL.map(l=>{
    const c = dirClass(l.amt);
    const sign = l.amt>=0 ? "買超" : "賣超";
    const abs = Math.abs(l.amt);
    let scale;
    if(l.who==="外資") scale = abs>=100?"明顯":(abs>=50?"偏向":"小幅");
    else if(l.who==="投信") scale = abs>=30?"明顯":(abs>=10?"偏向":"小幅");
    else scale = abs>=20?"明顯":(abs>=5?"偏向":"小幅");
    return `<div class="cell">
      <div class="who">${l.who}</div>
      <div class="amt ${c}">${sign} ${abs.toFixed(1)} 億</div>
      <div class="who">${scale}${l.amt>=0?"買進":"賣出"}</div>
    </div>`;
  }).join("");
  const tc = dirClass(total);
  const tsign = total>=0 ? "買超" : "賣超";
  const tmean = total>=0
    ? `今天三大法人<b>合計買超 ${Math.abs(total).toFixed(1)} 億</b>，代表外資、投信、自營商加起來是「買的比賣的多」，大戶資金偏多，對股價比較有支撐。`
    : `今天三大法人<b>合計賣超 ${Math.abs(total).toFixed(1)} 億</b>，代表加起來是「賣的比買的多」，大戶資金偏空，股價比較有壓力。`;
  document.getElementById("legal").innerHTML = cells +
    `<div class="legal-total">${tmean}</div>`;
}

function renderFooter(){
  document.getElementById("footer").innerHTML = `
    <p id="srcLine">資料來源：載入中…</p>
    <p>資料來源：Yahoo Finance（即時價與近一年日線）＋ 台灣證券交易所（三大法人）。台股一般漲跌幅上限 ±10%。</p>
    <p>提醒：年線（240 日）建議用「還原股價」看，因為每年除息會讓股價跳空，沒還原的長期均線會失真。</p>
    <p>免責聲明：投資有風險，本工具只做整理和白話說明，不構成買賣建議。</p>`;
}

function initFont(){
  const box = document.getElementById("fsbtns");
  const apply = v=>{
    document.documentElement.classList.remove("fs-big","fs-bigger");
    if(v==="big") document.documentElement.classList.add("fs-big");
    if(v==="bigger") document.documentElement.classList.add("fs-bigger");
    box.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.fs===v));
  };
  let saved=null; try{ saved=localStorage.getItem(K+"-fs"); }catch(e){}
  apply(saved||"0");
  box.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{ try{localStorage.setItem(K+"-fs", b.dataset.fs);}catch(e){} apply(b.dataset.fs); });
  });
}

function initAddPanel(){
  const btn=document.getElementById("addBtn");
  const panel=document.getElementById("addPanel");
  const search=document.getElementById("search");
  btn.addEventListener("click", ()=>{
    const open = panel.hidden;
    panel.hidden = !open;
    btn.classList.toggle("on", open);
    btn.textContent = open ? "收起" : "＋ 新增股票";
    if(open){ renderAddList(); search.focus(); }
  });
  let t=null;
  search.addEventListener("input", ()=>{ clearTimeout(t); t=setTimeout(renderAddList,120); });
}

renderIdx();
renderSummary();
renderStocks();
renderRanks();
renderLegal();
renderFooter();
initFont();
initAddPanel();

/* 載入真實行情 data.json（GitHub Pages 上會自動更新）；失敗則沿用示範數據 */
(async function loadLive(){
  try{
    const res = await fetch("data.json", {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    if(Array.isArray(d.stocks) && d.stocks.length){
      DB = d.stocks;
      if(d.index){ INDEX = d.index; if(Array.isArray(d.index.series) && d.index.series.length) indexSeries = d.index.series; }
      if(Array.isArray(d.legal) && d.legal.length) LEGAL = d.legal;
      renderIdx(); renderSummary(); renderStocks(); renderRanks(); renderLegal();
      const badge = document.getElementById("dataBadge");
      if(badge) badge.textContent = (d.session || "即時") + " " + String(d.updated || "").slice(-5);
      const src = document.getElementById("srcLine");
      if(src) src.innerHTML = `資料來源：Yahoo Finance（即時價與近一年日線）＋ 證交所（三大法人）。最後更新：<b>${d.updated || "—"}</b>（${d.session || ""}）`;
    }
  }catch(e){
    console.warn("無法載入 data.json，沿用示範數據：", e.message);
    const badge = document.getElementById("dataBadge");
    if(badge) badge.textContent = "示範數據（未連線）";
    const src = document.getElementById("srcLine");
    if(src) src.textContent = "目前顯示示範數據（無法連到 data.json，需透過網站開啟才會抓真實行情）。";
  }
})();
