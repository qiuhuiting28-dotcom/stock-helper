name: update-data

# 台北時間 = UTC+8
#   01:00–05:55 UTC（09:00–13:55 台北）→ 每 5 分鐘抓即時報價（quotes.json）
#   01:03 UTC（09:03）與 05:43 UTC（13:43）→ 完整重算（data.json：日線、均線、法人）
on:
  schedule:
    - cron: '*/5 1-5 * * 1-5'
    - cron: '3 1 * * 1-5'
    - cron: '43 5 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick（只抓即時價）或 full（完整重算）'
        default: 'full'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch market data
        run: |
          SCHED="${{ github.event.schedule }}"
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            # 只有兩個完整更新的時段跑 full，其餘排程一律 quick（寧可多抓即時價，不要每 5 分鐘重算整本）
            if [ "$SCHED" = "3 1 * * 1-5" ] || [ "$SCHED" = "43 5 * * 1-5" ] || [ -z "$SCHED" ]; then
              MODE=full
            else
              MODE=quick
            fi
          fi
          echo "mode=$MODE"
          if [ "$MODE" = "quick" ]; then
            python update.py --quick
          else
            python update.py data.json
          fi
      - name: Commit if changed
        run: |
          git config user.name "stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
